name: itda
description: "잇다(itda) — 부모·자녀 연결 돌봄 앱"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.8.0+1
  fl_chart: ^0.70.2
  flutter_riverpod: ^2.6.1
  flutter_svg: ^2.2.0
  go_router: ^14.8.1
  http: ^1.2.2
  image_picker: ^1.1.2
  intl: ^0.20.2
  path_provider: ^2.1.5
  permission_handler: ^11.3.1
  record: ^6.2.0
  pretty_dio_logger: ^1.4.0
  audioplayers: ^6.5.1
  flutter_local_notifications: ^21.0.0
  firebase_core: ^4.9.0
  firebase_messaging: ^16.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/
